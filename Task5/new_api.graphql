schema {
  query: Query
}

# Тип запросов
type Query {
  client(id: String!): Client
}

# Основная сущность клиента
type Client {
  id: String!
  name: String
  age: Int
  documents: [Document]
  relatives: [Relative]
}

# Сущность документа
type Document {
  id: String!
  type: String
  number: String
  issueDate: String
  expiryDate: String
}

# Сущность родственника
type Relative {
  id: String!
  relationType: String
  name: String
  age: Int
}
